[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netcoop"
version = "1.0.0"
description = "NetCoop AI: multi-agent network fault diagnosis with an interoperable message protocol (NMP)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "pydantic>=2.6,<3",    # NMP models are the protocol source of truth; JSON Schema export
  "pyyaml>=6",           # config/*.yaml (safe_load only)
  "fastapi>=0.110",      # optional read-only API (D7)
  "uvicorn>=0.29",       # serves the API
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "hypothesis>=6",       # property tests: normalizer never crashes on random input
  "httpx>=0.27",         # FastAPI TestClient
  "ruff>=0.5",
  "mcp>=1.2,<2",         # MCP server tests (netcoop mcp)
]

mcp = [
  "mcp>=1.2,<2",         # `netcoop mcp`: NetCoop as an MCP server (stdio); saves writing the protocol by hand
]

eval = [
  "matplotlib>=3.8",     # operating-point chart only (docs/operating_point.png)
]

a2a = [
  "a2a-sdk==1.3.0",      # OPTIONAL interop check only (tests/a2a_sdk). Pulls protobuf>=6: install it in its own
]                        # venv if your environment pins protobuf<6 (e.g. TensorFlow).

[project.scripts]
netcoop = "netcoop.cli:main"

# A2A: the core implements the A2A wire shapes (Agent Card at /.well-known/agent-card.json,
# JSON-RPC 2.0 `message/send`, Message.parts[kind=data]) over stdlib HTTP (CLAUDE.md §8 fallback).
# Compatibility is verified with the official a2a-sdk, pinned in the optional [a2a] extra.

[tool.setuptools.packages.find]
include = ["netcoop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "external: needs node to run the wireless_agent",
  "conformance: conformance kit against AGENT_URL",
  "a2a_sdk: official a2a-sdk client interop check (skipped unless a2a-sdk is installed)",
  "llm_live: real-model checks (skipped unless NETCOOP_LLM=local|cloud and the model is reachable)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d">
  <title id="t">NetCoop AI architecture</title>
  <desc id="d">An incident bundle is normalized, then six agents exchange NMP messages on an in-process bus with an event log. An A2A gateway connects the external Node.js wireless_agent, which speaks dialect v0.9. The reporting agent produces report.json. All knowledge lives in config YAML files.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #c9c8c0; stroke-width: 1.5; rx: 10; }
      .agent { fill: #eef4fc; stroke: #2a78d6; stroke-width: 1.5; }
      .ext { fill: #fdf0ea; stroke: #eb6834; stroke-width: 1.5; }
      .out { fill: #edf7f2; stroke: #1baf7a; stroke-width: 1.5; }
      .bus { fill: #f6f6f3; stroke: #9c9b94; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .h { font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0b0b0b; }
      .s { font: 12.5px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #52514e; }
      .lbl { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #52514e; }
      .line { stroke: #52514e; stroke-width: 1.6; fill: none; }
      .dash { stroke: #9c9b94; stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect x="0" y="0" width="1200" height="560" fill="#fcfcfb"/>

  <!-- input + normalizer -->
  <rect class="box" x="20" y="60" width="170" height="70" rx="10"/>
  <text class="h" x="105" y="90" text-anchor="middle">Incident bundle</text>
  <text class="s" x="105" y="110" text-anchor="middle">.json / .csv, any dialect</text>

  <rect class="box" x="20" y="200" width="170" height="110" rx="10"/>
  <text class="h" x="105" y="228" text-anchor="middle">Normalizer</text>
  <text class="s" x="105" y="250" text-anchor="middle">aliases · units · IDs · time</text>
  <text class="s" x="105" y="268" text-anchor="middle">recover / quarantine</text>
  <text class="s" x="105" y="286" text-anchor="middle">never silently drop</text>
  <path class="line" d="M105,130 L105,198" marker-end="url(#arrow)"/>

  <!-- bus -->
  <rect class="bus" x="240" y="40" width="560" height="430" rx="14"/>
  <text class="h" x="520" y="66" text-anchor="middle">In-process bus + append-only event log</text>
  <text class="s" x="520" y="84" text-anchor="middle">every message gets a seq before delivery · runs/&lt;id&gt;/events.jsonl</text>
  <path class="line" d="M190,255 L238,255" marker-end="url(#arrow)"/>
  <text class="lbl" x="213" y="245" text-anchor="middle" style="font-size:10.5px">summary</text>

  <rect class="agent" x="265" y="105" width="160" height="70" rx="10"/>
  <text class="h" x="345" y="133" text-anchor="middle">performance_agent</text>
  <text class="s" x="345" y="153" text-anchor="middle">latency · loss · jitter · util</text>

  <rect class="agent" x="440" y="105" width="160" height="70" rx="10"/>
  <text class="h" x="520" y="133" text-anchor="middle">infrastructure_agent</text>
  <text class="s" x="520" y="153" text-anchor="middle">CPU · memory · errors · drops</text>

  <rect class="agent" x="615" y="105" width="165" height="70" rx="10"/>
  <text class="h" x="697" y="133" text-anchor="middle">connectivity_agent</text>
  <text class="s" x="697" y="153" text-anchor="middle">scope · upstream · DNS/DHCP</text>

  <rect class="agent" x="300" y="215" width="440" height="100" rx="10"/>
  <text class="h" x="520" y="243" text-anchor="middle">correlation_agent</text>
  <text class="s" x="520" y="265" text-anchor="middle">hypotheses · conflicts (C1–C3) · documented scoring</text>
  <text class="s" x="520" y="285" text-anchor="middle">predictions logged BEFORE evidence is requested</text>
  <text class="s" x="520" y="303" text-anchor="middle">evidence requests routed through the bus</text>

  <rect class="agent" x="300" y="350" width="440" height="90" rx="10"/>
  <text class="h" x="520" y="378" text-anchor="middle">reporting_agent</text>
  <text class="s" x="520" y="400" text-anchor="middle">playbook actions → policy check (R1–R5) → validator</text>
  <text class="s" x="520" y="420" text-anchor="middle">no certainty language · ≥ 1 limitation</text>

  <path class="line" d="M520,175 L520,213" marker-end="url(#arrow)"/>
  <path class="line" d="M520,315 L520,348" marker-end="url(#arrow)"/>

  <!-- gateway + external agent -->
  <rect class="box" x="860" y="160" width="190" height="110" rx="10"/>
  <text class="h" x="955" y="188" text-anchor="middle">A2A gateway</text>
  <text class="s" x="955" y="210" text-anchor="middle">allowlist · card check</text>
  <text class="s" x="955" y="228" text-anchor="middle">256 KB cap · timeout</text>
  <text class="s" x="955" y="246" text-anchor="middle">0.9 → 1.0 upcaster</text>
  <path class="line" d="M800,215 L858,215" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="lbl" x="830" y="164" text-anchor="middle">NMP 1.1</text>
  <text class="lbl" x="830" y="180" text-anchor="middle">in A2A</text>
  <text class="lbl" x="830" y="196" text-anchor="middle">data part</text>

  <rect class="ext" x="860" y="330" width="190" height="110" rx="10"/>
  <text class="h" x="955" y="358" text-anchor="middle">wireless_agent</text>
  <text class="s" x="955" y="380" text-anchor="middle">Node.js · dialect v0.9</text>
  <text class="s" x="955" y="398" text-anchor="middle">signal · noise_margin · retx</text>
  <text class="s" x="955" y="416" text-anchor="middle">joins mid-session (hot-plug)</text>
  <path class="line" d="M955,270 L955,328" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="lbl" x="1010" y="303">HTTP 127.0.0.1</text>

  <!-- output -->
  <rect class="out" x="860" y="40" width="320" height="90" rx="10"/>
  <text class="h" x="1020" y="66" text-anchor="middle">report.json</text>
  <text class="s" x="1020" y="88" text-anchor="middle">root cause · evidence · confidence · alternatives</text>
  <text class="s" x="1020" y="106" text-anchor="middle">limitations · predictions · blocked actions</text>
  <path class="line" d="M740,395 C820,395 820,85 858,85" marker-end="url(#arrow)"/>

  <!-- config -->
  <rect class="box" x="240" y="490" width="560" height="56" rx="10"/>
  <text class="h" x="520" y="514" text-anchor="middle">config/*.yaml: all knowledge, no thresholds in code</text>
  <text class="s" x="520" y="533" text-anchor="middle">metrics · signatures · playbook · policies · topology · scoring</text>
  <path class="dash" d="M240,518 L105,518 L105,312" marker-end="url(#arrow)"/>
</svg>

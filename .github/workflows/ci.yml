name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      NETCOOP_LLM: "off"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python package
        run: python -m pip install -e ".[dev]"

      - name: Install wireless_agent (no dependencies; validates the lockfile)
        working-directory: external_agents/wireless_agent
        run: npm ci

      - name: Lint
        run: python tasks.py lint

      - name: Tests (offline)
        run: |
          set -o pipefail
          python -m pytest tests -q -p no:warnings -rfE --color=no 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          # surface failing tests as public annotations (job logs need auth to read)
          grep -E "^(FAILED|ERROR) " pytest.log | sed 's/^/::error title=pytest::/' || true
          exit $status

      - name: Demo (all scenarios, LLM off)
        run: python tasks.py demo

      - name: Conformance vs the Node wireless_agent
        run: |
          node external_agents/wireless_agent/server.js --port 8765 &
          for i in $(seq 1 50); do
            curl -fs http://127.0.0.1:8765/healthz >/dev/null && break
            sleep 0.2
          done
          python tasks.py conformance http://127.0.0.1:8765

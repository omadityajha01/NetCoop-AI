# Scoring constants (CLAUDE.md §6.3). INITIAL values.
# Tune on eval seed range A; report on seed range B; never tune on demo scenarios.
contra_penalty: 1.0            # TUNED on seed range A (was 0.5); score = clamp(support - contra_penalty * contra, 0, 1) * quality
quality_floor: 0.5             # quality = max(quality_floor, mean(completeness) - coerced_penalty * n_coerced)
coerced_penalty: 0.05
stale_quality: 0.5             # completeness assigned to findings of a source marked stale (C2)

status:
  min_top_score: 0.55          # T3: chosen on seed A (max accuracy s.t. wrong<=3%, normal FP<=5%); below -> no_fault_detected (nothing >= high) or insufficient_evidence (something >= high)
  min_top_coverage: 0.50       # coverage(top) below -> insufficient_evidence (data missing); checked first
  min_margin: 0.15             # below (after prediction rounds) -> probable

confidence:
  high_min: 0.75
  high_min_margin: 0.25
  medium_min: 0.50

conflicts:
  c1_relative_diff: 0.20       # same metric+entity, overlapping windows, |a-b|/max(|a|,|b|) > this

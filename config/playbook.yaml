# fault_type -> checks -> actions. Every recommended action comes from here and passes policy/checker.py (G3).
# Placeholders: {entity} hypothesis entity id, {device} primary device for the hypothesis, {segment} its segment.
# `action` is the verb policies match on; `target` names which placeholder is the target device.
# Actions are recommendations for human review. NetCoop never executes them (G2).

congestion:
  checks:
    - "Compare egress utilization on {entity} with its upstream link"
  actions:
    - {id: CONG-1, action: inspect,     target: device, text: "Inspect upstream and egress link utilization on {entity}"}
    - {id: CONG-2, action: review_qos,  target: device, text: "Review queue configuration and traffic distribution on {device}"}
    - {id: CONG-3, action: rate_limit,  target: device, text: "Apply temporary rate limiting to top talkers behind {device}"}
    - {id: CONG-4, action: reboot,      target: device, text: "Reboot {device} if egress queues remain stuck after traffic is reduced"}

interface_fault:
  checks:
    - "Check CRC/interface error counters on both ends of {entity}"
  actions:
    - {id: IF-1, action: inspect,         target: device, text: "Inspect cabling, optics and port counters on {entity}"}
    - {id: IF-2, action: move_port,       target: device, text: "Move the uplink on {device} to a spare port and monitor errors"}
    - {id: IF-3, action: replace_optic,   target: device, text: "Replace the transceiver/cable on {entity} if errors persist"}
    - {id: IF-4, action: reboot,          target: device, text: "Reboot {device} only if the port fails to recover"}

device_overload:
  checks:
    - "Identify the processes consuming CPU on {device}"
  actions:
    - {id: OVL-1, action: inspect,        target: device, text: "Inspect CPU-bound processes and control-plane traffic on {device}"}
    - {id: OVL-2, action: config_change,  target: device, text: "Apply control-plane policing on {device}"}
    - {id: OVL-3, action: reboot,         target: device, text: "Reboot {device} during a maintenance window"}

weak_wifi:
  checks:
    - "Survey RF signal and channel utilization around {entity}"
  actions:
    - {id: WIFI-1, action: inspect,       target: device, text: "Run an RF survey around {entity} and check for interference"}
    - {id: WIFI-2, action: config_change, target: device, text: "Adjust transmit power and channel on {entity}"}
    - {id: WIFI-3, action: relocate,      target: device, text: "Consider relocating {entity} or adding an access point to {segment}"}

dns_failure:
  checks:
    - "Query {entity} directly from a wired host"
  actions:
    - {id: DNS-1, action: inspect,         target: device, text: "Check resolver health, upstream forwarders and logs on {entity}"}
    - {id: DNS-2, action: failover,        target: device, text: "Point DHCP-provided resolvers to the secondary DNS while {entity} is investigated"}
    - {id: DNS-3, action: restart_service, target: device, text: "Restart the DNS service on {entity}"}

dhcp_failure:
  checks:
    - "Check address-pool utilization and relay configuration for {entity}"
  actions:
    - {id: DHCP-1, action: inspect,         target: device, text: "Inspect lease pool exhaustion and relay (ip helper) settings for {entity}"}
    - {id: DHCP-2, action: config_change,   target: device, text: "Extend the address pool or shorten lease time on {entity}"}
    - {id: DHCP-3, action: restart_service, target: device, text: "Restart the DHCP service on {entity}"}

_insufficient_evidence:
  actions:
    - {id: GEN-1, action: collect, target: none, text: "Collect the missing signals listed in this report and re-run the diagnosis"}

_no_fault:
  actions:
    - {id: GEN-2, action: monitor, target: none, text: "No action required; continue monitoring"}

latency_spike:
  checks:
    - "Compare latency and jitter on {device} with its upstream path"
  actions:
    - {id: LAT-1, action: inspect,       target: device, text: "Inspect the forwarding path and recent routing changes for {device}"}
    - {id: LAT-2, action: review_qos,    target: device, text: "Review QoS/priority queuing for latency-sensitive traffic on {device}"}
    - {id: LAT-3, action: inspect,       target: device, text: "Check upstream provider/WAN latency reports for the {segment} segment"}

hardware_failure:
  checks:
    - "Check hardware health (power, fans, line cards, optics) on {device}"
  actions:
    - {id: HW-1, action: inspect,          target: device, text: "Inspect hardware logs, power and line-card status on {device}"}
    - {id: HW-2, action: failover,         target: device, text: "Fail traffic over from {device} to a redundant path"}
    - {id: HW-3, action: replace_hardware, target: device, text: "Open an RMA / replace the faulty hardware in {device}"}
    - {id: HW-4, action: reboot,           target: device, text: "Reboot {device} only if hardware diagnostics pass"}

# Dry-run templates (S1), one per action verb. Rendered ONLY after a human approves an action that passes the policy
# checker, and emitted as an NMP `remediation_plan` labelled "SIMULATED – NOT EXECUTED". NetCoop never executes these
# steps: no network, no shell (G1/G2). Placeholders: {target} the action's target device (validated topology id),
# {segment} its segment, {action_id} the playbook action id. Substitution is single-pass and literal.
_dry_run:
  inspect:
    steps: ["Open a read-only session to {target}", "Collect the counters and logs named in {action_id}", "Attach the collected output to the incident"]
    rollback: ["Close the read-only session to {target}; nothing was changed"]
  review_qos:
    steps: ["Export the current QoS / queue configuration of {target}", "Compare queue thresholds with the {segment} traffic profile", "Draft a proposed queue change for review"]
    rollback: ["Discard the draft; the exported configuration of {target} stays unchanged"]
  rate_limit:
    steps: ["Save the running configuration of {target}", "Prepare a temporary rate-limit policy for the top talkers behind {target}", "Schedule an expiry for the temporary policy"]
    rollback: ["Remove the temporary rate-limit policy and restore the saved configuration of {target}"]
  reboot:
    steps: ["Save the running configuration of {target}", "Announce a maintenance notice for the {segment} segment", "Reload {target} in a maintenance window"]
    rollback: ["If {target} does not return, boot the saved configuration and fail traffic to the redundant path"]
  move_port:
    steps: ["Save the running configuration of {target}", "Prepare the spare port on {target} with the uplink configuration", "Move the uplink cable to the spare port"]
    rollback: ["Move the cable back and restore the saved port configuration on {target}"]
  replace_optic:
    steps: ["Identify the transceiver model and port on {target}", "Prepare a spare transceiver of the same model", "Swap the transceiver during a maintenance window"]
    rollback: ["Reinstall the original transceiver on {target}"]
  config_change:
    steps: ["Save the running configuration of {target}", "Prepare the configuration change named in {action_id}", "Apply it during a maintenance window"]
    rollback: ["Restore the saved configuration of {target}"]
  relocate:
    steps: ["Survey candidate mounting points near {target} in {segment}", "Prepare a site plan for review"]
    rollback: ["Keep {target} in place; the site plan is only a proposal"]
  failover:
    steps: ["Check that the redundant path for {target} is healthy", "Prepare the failover change for {target}", "Shift traffic in a maintenance window"]
    rollback: ["Shift traffic back to {target} and restore the saved configuration"]
  restart_service:
    steps: ["Check the service status on {target}", "Restart the service on {target} in a maintenance window"]
    rollback: ["If the service does not start, restore its previous configuration on {target}"]
  replace_hardware:
    steps: ["Open an RMA for the faulty component in {target}", "Schedule the replacement in a maintenance window"]
    rollback: ["Reinstall the original component in {target} if the replacement fails its checks"]
  collect:
    steps: ["Collect the missing signals listed in the report", "Re-run the diagnosis with the new data"]
    rollback: ["Nothing to undo: data collection only"]
  monitor:
    steps: ["Keep the current monitoring in place"]
    rollback: ["Nothing to undo"]
